<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .folhas { transform-origin: 32px 19px; animation: f 2.4s ease-in-out infinite; }
    .olhos { transform-origin: 32px 37px; animation: p 4s infinite; }
    @keyframes f { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes p { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { .folhas, .olhos { animation: none; } }
  </style>
  <rect width="64" height="64" rx="16" fill="#e3f6ee"/>
  <g class="folhas">
    <path d="M32 21 V13" stroke="#1f7a45" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M32 14 C26 5 15 6 13 12 C19 18 28 18 32 14Z" fill="#34c38f"/>
    <path d="M32 14 C38 4 50 5 52 11 C46 18 36 18 32 14Z" fill="#0f9d6b"/>
  </g>
  <circle cx="32" cy="40" r="20" fill="#0f9d6b"/>
  <g class="olhos">
    <circle cx="24.5" cy="37" r="5.2" fill="#fff"/><circle cx="39.5" cy="37" r="5.2" fill="#fff"/>
    <circle cx="25.5" cy="37.6" r="2.8" fill="#10233a"/><circle cx="40.5" cy="37.6" r="2.8" fill="#10233a"/>
  </g>
  <path d="M27 47 Q32 51.5 37 47" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
